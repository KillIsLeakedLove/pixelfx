<!doctype html>
<html lang="en">
<head>

<body>
<!--BODY-->
<header class="head">

    <svg class="mark" viewBox="0 0 48 48" role="img" aria-label="Patch"><rect x="3" y="3" width="42" height="42" rx="10" fill="#ffffff"/><path d="M13 28c8-1 9-13 20-13 4 0 6 3 3 6-5 4-5 8 0 12 3 3 1 6-3 6-11 0-12-11-20-12-4 0-4-4 0-5Z" fill="#f53cd1"/></svg>
    <div>
      <h1>pixelfx.</h1>
      <p class="sub"><span id="count">0</span> <span id="tagline">smooth HD effects, every one a small piece of code.</span></p>
    </div>
  </div>
  <nav class="links" aria-label="Site links">
    <a id="link-github" href="https://github.com/patch-gg/pixelfx" target="_blank" rel="noopener">github</a>
    <a id="link-skill" href="https://github.com/patch-gg/pixelfx#the-skill" target="_blank" rel="noopener">pixelfx skill</a>

      <button id="lang-en" type="button" aria-pressed="true" lang="en">EN</button>
      <button id="lang-zh" type="button" aria-pressed="false" lang="zh-CN">中文</button>
    </span>
  </nav>
</header>
<div class="bar">
  <div class="bar-in">
    <div class="chips" id="chips" role="group" aria-label="Categories"></div>
    <input id="q" type="search" placeholder="search effects" aria-label="Search effects" autocomplete="off">
  </div>
</div>
<main id="grid"></main>
<p class="empty" id="none" hidden>Nothing matches that. Try fire, slash or loop.</p>
<dialog class="detail" id="detail" aria-labelledby="d-name">
  <div class="sheet">
    <div>
      <div class="big"><canvas id="big"></canvas><button class="close" id="d-close" type="button" data-i18n="close">close</button></div>
    </div>
    <div class="info">
      <h2 id="d-name"></h2>
      <div class="id" id="d-id"></div>
      <p id="d-desc"></p>
      <dl class="facts" id="d-facts"></dl>
      <div class="controls">
        <div class="row"><label data-i18n="play">play</label><button class="btn" id="d-play" type="button">pause</button><button class="btn" id="d-again" type="button" data-i18n="again">again</button><span id="d-speed" class="row"></span></div>
        <div class="row"><label data-i18n="backdrop">backdrop</label><span id="d-bg" class="row"></span></div>
        <div class="row"><label data-i18n="palette">palette</label><select class="btn" id="d-pal" aria-label="Palette"></select><button class="btn" id="d-seed" type="button" data-i18n="newSeed">new seed</button></div>

      </div>
      <div class="code-head"><span data-i18n="useIt">use it</span><span><a id="d-src" target="_blank" rel="noopener" data-i18n="source">source</a> · <button class="btn" id="d-copy" type="button" data-i18n="copy">copy</button></span></div>
      <pre id="d-code"></pre>
    </div>
    <div class="sheetout" id="d-sheet"></div>
  </div>
</dialog>

<script type="module" src="app.js"></script>

</html>
